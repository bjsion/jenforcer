name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Configure Maven credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          settings = ET.Element("settings")
          servers = ET.SubElement(settings, "servers")
          for server_id, username, password in (
              ("central", os.environ["CENTRAL_USERNAME"], os.environ["CENTRAL_PASSWORD"]),
              ("github", os.environ["GITHUB_ACTOR"], os.environ["GITHUB_TOKEN"]),
          ):
              server = ET.SubElement(servers, "server")
              ET.SubElement(server, "id").text = server_id
              ET.SubElement(server, "username").text = username
              ET.SubElement(server, "password").text = password

          maven_dir = Path.home() / ".m2"
          maven_dir.mkdir(parents=True, exist_ok=True)
          ET.indent(settings)
          ET.ElementTree(settings).write(
              maven_dir / "settings.xml", encoding="UTF-8", xml_declaration=True
          )
          PY
      - name: Validate release tag
        id: release
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", tag):
              raise SystemExit(f"Expected a semantic version tag, got {tag!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={tag[1:]}\n")
          PY
      - name: Import Maven Central signing key
        env:
          CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.CENTRAL_GPG_PRIVATE_KEY }}
        run: printf '%s' "$CENTRAL_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish to Maven Central and GitHub Packages
        env:
          CENTRAL_GPG_PASSPHRASE: ${{ secrets.CENTRAL_GPG_PASSPHRASE }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./mvnw --batch-mode deploy "-Drevision=$RELEASE_VERSION" -Djenforcer.publish=true
